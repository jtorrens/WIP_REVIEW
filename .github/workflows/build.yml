name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            runner: '["macos-14"]'
            build_dir: build-ci-macos
            artifact_name: WIPReviewProbe-macos
          - os: windows-cuda
            runner: '["self-hosted", "Windows", "X64", "cuda"]'
            build_dir: build-ci-windows
            artifact_name: WIPReviewProbe-windows-x64
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows toolchain
        if: matrix.os == 'windows-cuda'
        shell: pwsh
        run: |
          'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CUDAToolkit_ROOT=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: >-
          cmake -S . -B ${{ matrix.build_dir }}
          -DCMAKE_BUILD_TYPE=Release
          -DWIPREVIEW_BUILD_TESTS=ON
          -DWIPREVIEW_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel
      - name: Test
        run: ctest --test-dir ${{ matrix.build_dir }} -C Release --output-on-failure
      - name: Package
        run: cpack --config ${{ matrix.build_dir }}/CPackConfig.cmake -C Release
      - name: Upload OFX bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_dir }}/WIPReviewProbe.ofx.bundle
            ${{ matrix.build_dir }}/*.zip
          if-no-files-found: error
          retention-days: 14
