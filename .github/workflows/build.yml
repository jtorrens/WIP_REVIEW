name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            build_dir: build-ci-macos
            artifact_name: WIPReviewProbe-macos-universal
          - os: windows-2022
            build_dir: build-ci-windows
            artifact_name: WIPReviewProbe-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA Toolkit
        if: matrix.os == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
      - name: Configure
        run: >-
          cmake -S . -B ${{ matrix.build_dir }}
          -DCMAKE_BUILD_TYPE=Release
          -DWIPREVIEW_BUILD_TESTS=ON
          -DWIPREVIEW_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel
      - name: Verify macOS universal binary
        if: matrix.os == 'macos-14'
        run: lipo ${{ matrix.build_dir }}/WIPReviewProbe.ofx.bundle/Contents/MacOS/WIPReviewProbe.ofx -verify_arch arm64 x86_64
      - name: Test
        run: ctest --test-dir ${{ matrix.build_dir }} -C Release --output-on-failure
      - name: Upload OFX bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.build_dir }}/WIPReviewProbe.ofx.bundle
          if-no-files-found: error
          retention-days: 14
